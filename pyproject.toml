[project]
name = "fastapi-auth-sessions-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pyjwt>=2.14.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# B008: FastAPI dependency injection uses callables in default arguments by design.
# BLE001: test helpers deliberately collect any exception from worker threads.
ignore = ["B008", "BLE001"]
